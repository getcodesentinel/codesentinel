name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  id-token: write
  pull-requests: write

jobs:
  test-code:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/test-code.yml

  release:
    needs: test-code
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify CLI package artifact
        run: pnpm verify:cli-package

      - name: Release
        run: pnpm release
        env:
          # test-code already verified this commit; the hook would re-run pnpm verify
          # against a tree whose packages/mcp/package.json semantic-release has already rewritten.
          HUSKY: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
