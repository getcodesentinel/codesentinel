name: CodeSentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  codesentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure git history for CodeSentinel
        run: |
          set -euo pipefail
          git fetch --prune --unshallow || true
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Run CodeSentinel
        run: npx codesentinel ci --baseline-ref auto --max-repo-score 55 --max-repo-delta 0.03 --no-new-cycles --no-new-high-risk-deps --max-new-hotspots 2 --fail-on error --json-output codesentinel-ci.json

      - name: Build ownership report
        if: always() && hashFiles('CODEOWNERS', '.github/CODEOWNERS', 'docs/CODEOWNERS') != ''
        run: npx codesentinel owners --format md --output ownership.md

      - name: Build ownership SARIF
        if: always() && hashFiles('CODEOWNERS', '.github/CODEOWNERS', 'docs/CODEOWNERS') != ''
        run: npx codesentinel owners --format sarif --output codesentinel-ownership.sarif

      - name: Upload ownership SARIF
        if: always() && hashFiles('codesentinel-ownership.sarif') != '' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codesentinel-ownership.sarif
          category: codesentinel-ownership

      - name: Post summary comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx codesentinel comment --input codesentinel-ci.json --pr ${{ github.event.pull_request.number }} --comment-on change
