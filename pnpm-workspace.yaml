packages:
  - "packages/*"

allowBuilds:
  esbuild: true

# Security overrides for advisories that neither the direct dependency nor its parent can
# resolve inside the range it declares. Every package below is dev or release tooling
# (eslint, semantic-release, tailwind); none of them is a runtime dependency of the CLI
# or the MCP wrapper. Remove an entry once the direct parent accepts a patched version
# natively.
overrides:
  # GHSA-g3hv-75wg-m249 (DoS via globparts amplification). No fix exists in the 10.x
  # line: the lowest patched version is 11.0.1. eslint and @eslint/config-array only use
  # `new Minimatch()` and `minimatch()`, both still exported by v11 (makeRe, matchOne and
  # the debug option were removed and are not used here).
  minimatch: ">=11.0.1 <12"

  # GHSA-2m5v-pch6-74hx (high, TLS certificate validation bypass) plus the rest of the
  # 2026-10 undici batch. The fix is 6.29.1 on the 6.x line and 7.30.1 on 7.x. Keep the
  # majors apart: @actions/http-client depends on undici 6 and must not be collapsed onto 7.x.
  undici@6: ">=6.29.1 <9"
  undici@7: ">=7.30.1 <8"

  # GHSA-8r5x-fm3f-whwj and GHSA-p8wg-vrv2-v86f (critical, JavaScript injection through
  # conventional-changelog-writer). Patched in 4.7.10.
  handlebars: ">=4.7.10 <5"

  # GHSA-2883-xcg3-v3hh (high, CPU exhaustion when cosmiconfig parses YAML). Patched in 4.3.2.
  js-yaml: ">=4.3.2 <5"

  # GHSA-68fv-2mgg-jv7q (high, event-loop DoS through indexed section offsets, reached via
  # @tailwindcss/node). Patched in 1.2.2.
  source-map-js: ">=1.2.2 <2"
